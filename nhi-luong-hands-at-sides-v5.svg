<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 530" data-pose="both-arms-at-sides" role="img" aria-label="Lương chibi tóc đen ngắn, má hồng, áo polo nâu sọc, quần đen, giày trắng, bước đi về phía Nhi">
<defs>
 <linearGradient id="boySkin" x1="0" y1="0" x2=".95" y2="1"><stop stop-color="#fff5e9"/><stop offset=".55" stop-color="#ffe1cf"/><stop offset="1" stop-color="#f1bdae"/></linearGradient>
 <linearGradient id="boyHair" x1=".12" y1="0" x2=".9" y2="1"><stop stop-color="#555055"/><stop offset=".38" stop-color="#302f33"/><stop offset="1" stop-color="#151b20"/></linearGradient>
 <linearGradient id="boyShirt" x1="0" y1="0" x2="1" y2=".85"><stop stop-color="#705049"/><stop offset=".55" stop-color="#4f3631"/><stop offset="1" stop-color="#34262a"/></linearGradient>
 <linearGradient id="boyPants" x1=".2" y1="0" x2="1" y2="1"><stop stop-color="#3c3a40"/><stop offset=".5" stop-color="#26262b"/><stop offset="1" stop-color="#141b23"/></linearGradient>
 <linearGradient id="boyShoe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdfa"/><stop offset="1" stop-color="#e8e1de"/></linearGradient>
 <radialGradient id="boyCheek"><stop stop-color="#f29396" stop-opacity=".9"/><stop offset="1" stop-color="#e99a9d" stop-opacity="0"/></radialGradient>
 <pattern id="poloRib" width="13" height="12" patternUnits="userSpaceOnUse"><path d="M5 0v12" stroke="#1d1719" stroke-opacity=".23" stroke-width="2"/><path d="M8 0v12" stroke="#b98e83" stroke-opacity=".21" stroke-width="1"/></pattern>
 <filter id="boyShadow" x="-25%" y="-40%" width="150%" height="185%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<!-- Gentle ground shadow -->
<ellipse cx="160" cy="518" rx="102" ry="9" fill="#6f5860" opacity=".18" filter="url(#boyShadow)"/>
<!-- Articulated left leg pivoting beneath pants waist -->
<g class="nhi-boy-leg nhi-boy-leg-right" style="transform-origin:196px 367px">
 <path d="M180 363Q221 362 220 403L231 483q4 17-10 23l-34 0q-9-7-12-23l-16-67Z" fill="url(#boyPants)" stroke="#28252a" stroke-width="5" stroke-linejoin="round"/>
 <path d="M204 405q6 37 10 77" stroke="#787478" stroke-opacity=".36" stroke-width="3.4" fill="none" stroke-linecap="round"/>
 <path d="M193 479q-4 15-2 25 25 5 48-4 9-11-10-16" fill="url(#boyShoe)" stroke="#3b3439" stroke-width="4" stroke-linejoin="round"/>
 <path d="M194 496q20 6 43-1M207 484l10 6M215 483l9 5" stroke="#c4b9b4" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</g>
<g class="nhi-boy-leg nhi-boy-leg-left" style="transform-origin:119px 368px">
 <path d="M102 363Q77 392 85 431L73 487q-4 16 12 21l37-1q10-3 13-19l18-81Z" fill="url(#boyPants)" stroke="#29272e" stroke-width="5.5" stroke-linejoin="round"/>
 <path d="M106 401q-2 46-12 86M117 411q9 7 11 21" stroke="#797277" stroke-opacity=".35" stroke-width="3.2" fill="none" stroke-linecap="round"/>
 <path d="M86 480q-17 4-26 20-4 10 8 12h68q9-2-4-15l-20-17Z" fill="url(#boyShoe)" stroke="#3d3539" stroke-width="4.2" stroke-linejoin="round"/>
 <path d="M62 503q31 11 72-1M75 490l15 8M87 486l12 10" stroke="#c5bbb7" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</g>
<!-- Torso and collar: chocolate striped short sleeve polo -->
<path d="M101 277Q75 283 66 315L58 373Q100 399 161 398q67-2 103-24l-24-73q-9-21-43-27l-24-7-55 5Z" fill="url(#boyShirt)" stroke="#35272c" stroke-width="5" stroke-linejoin="round"/>
<path d="M101 277Q75 283 66 315L58 373Q100 399 161 398q67-2 103-24l-24-73q-9-21-43-27l-24-7-55 5Z" fill="url(#poloRib)" opacity=".85"/>
<path d="M90 302l-11 62q78 32 165 4l-14-64" stroke="#ad7f73" stroke-opacity=".24" stroke-width="4" fill="none"/>
<!-- Neck -->
<path d="M128 244v47q18 22 52 2l-3-54" fill="url(#boySkin)" stroke="#9f716a" stroke-width="3.7"/>
<path d="M126 282q13 17 33 20l-19 26-23-36Zm56-4q-9 19-23 24l18 27 29-41Z" fill="#745449" stroke="#382b2e" stroke-width="4" stroke-linejoin="round"/>
<path d="M160 305v60" stroke="#392a2c" stroke-width="4.3" stroke-linecap="round"/>
<circle cx="160" cy="319" r="4" fill="#e2bbb0" stroke="#3c292d" stroke-width="2"/><circle cx="161" cy="341" r="3.5" fill="#dbb1a7" stroke="#3c292d" stroke-width="1.6"/>
<!-- Left arm hangs visibly at his side, with bracelet and open hand. -->
<g class="nhi-boy-arm nhi-boy-arm-left" style="transform-origin:85px 302px">
 <path d="M88 296Q62 299 54 327L43 380q-4 21 16 34 12 6 22-4l19-55-1-33" fill="url(#boySkin)" stroke="#3c2b2e" stroke-width="4.6" stroke-linejoin="round"/>
 <path d="M89 293Q56 299 53 330l-3 21 41 13 15-54Z" fill="url(#boyShirt)" stroke="#38292a" stroke-width="5" stroke-linejoin="round"/>
 <path d="M89 293Q56 299 53 330l-3 21 41 13 15-54Z" fill="url(#poloRib)"/>
 <path d="M52 349q20 17 40 14" stroke="#291f20" stroke-width="4" fill="none"/>
 <path d="M55 395q-5 12 6 20" stroke="#e0a99e" fill="none" stroke-width="3"/>
 <g fill="#846043" stroke="#3b3029" stroke-width="1.7"><circle cx="60" cy="391" r="5"/><circle cx="68" cy="395" r="5"/><circle cx="76" cy="396" r="5"/><circle cx="84" cy="393" r="4"/></g>
 <path d="M65 414q3 13 16 11l12-13-12-14" fill="url(#boySkin)" stroke="#4a3334" stroke-width="3.2"/>
</g>
<!-- Right arm hangs visibly and naturally at his side (NOT behind his back). -->
<g class="nhi-boy-arm nhi-boy-arm-right" style="transform-origin:226px 306px">
 <path d="M222 307q23-2 31 28l15 59q1 20-19 24l-15-11q6-9 0-23l-21-42Z" fill="url(#boySkin)" stroke="#392a2d" stroke-width="4" stroke-linejoin="round"/>
 <path d="M212 291q33 4 43 35l8 26-38 12-28-51Z" fill="url(#boyShirt)" stroke="#39292d" stroke-width="4.5"/>
 <path d="M212 291q33 4 43 35l8 26-38 12-28-51Z" fill="url(#poloRib)"/>
 <path d="M230 366q19 0 34-13" stroke="#292326" stroke-width="4" fill="none"/>
 <path d="M246 414q7 12 14 4l8-13" stroke="#c88d84" stroke-width="3" fill="none"/>
</g>
<!-- Oversized cute chibi head, slightly turned left to greet Nhi -->
<g class="nhi-boy-head" style="transform-origin:151px 243px">
 <!-- ears and face -->
 <path d="M62 159Q52 91 103 64q71-42 133 2 39 29 32 99l-11 39q-3 35-29 58-23 19-65 20-60 0-83-34-17-19-17-61l-5-9Z" fill="url(#boySkin)" stroke="#342a2c" stroke-width="5.7" stroke-linejoin="round"/>
 <path d="M66 178q-22-10-26 9-2 26 27 30M260 181q21-9 27 9 4 25-23 27" fill="url(#boySkin)" stroke="#35292c" stroke-width="4.2"/>
 <path d="M49 191q7-4 12 9M269 195q9-8 11 5" stroke="#e5ada4" stroke-width="2.8" stroke-linecap="round" fill="none"/>
 <!-- short black hair with softly swept fringe, reflecting reference photograph -->
 <path d="M59 187q-16-24-10-53l-17 5q7-23 22-34l-9-9q10-15 27-22l-2-12q18-4 31-16l-4-8q22-4 44 1 25-18 52-9 29-3 51 19 29 11 36 39l8 20-8 21q15 19 6 43l-19 24q-2-28-12-42-19-14-23-37-24 5-45-9-43 20-80 4-14 26-37 34-6 19-11 41Z" fill="url(#boyHair)" stroke="#23252b" stroke-width="5.5" stroke-linejoin="round"/>
 <path d="M72 99q24-35 67-36M137 47q27 4 54 3M191 48q33 12 47 36M104 91q27-9 48-5M161 80q26 15 54 7M240 109q18 24 16 44" stroke="#9c9692" stroke-opacity=".40" fill="none" stroke-width="5" stroke-linecap="round"/>
 <path d="M61 142q13-23 18-39M85 96q30-17 56-13M178 90q38 17 58 2M253 115q16 20 11 44" stroke="#151820" stroke-opacity=".65" fill="none" stroke-width="3" stroke-linecap="round"/>
 <!-- natural light highlights -->
 <ellipse cx="112" cy="67" rx="13" ry="5" fill="#a3a1a1" opacity=".39" transform="rotate(-19 112 67)"/>
 <ellipse cx="233" cy="67" rx="6" ry="3" fill="#b2ada7" opacity=".5"/>
 <!-- brows -->
 <path d="M93 184q15-11 28-2M181 181q16-10 29 0" stroke="#45343a" stroke-width="4.8" fill="none" stroke-linecap="round"/>
 <!-- Blink is animated from external CSS, eyes stay smile-shaped by default -->
 <g class="nhi-boy-eyes">
 <path d="M95 205q13 16 27 2M177 203q13 16 29 0" stroke="#342c32" stroke-width="6.2" fill="none" stroke-linecap="round"/>
 <path d="M95 205l-5-3M206 203l4-3" stroke="#342c32" stroke-width="2" stroke-linecap="round"/>
 </g>
 <!-- cheek blush -->
 <ellipse cx="99" cy="225" rx="28" ry="18" fill="url(#boyCheek)"/>
 <ellipse cx="213" cy="225" rx="28" ry="18" fill="url(#boyCheek)"/>
 <path d="M89 227l3 7M99 223l4 8M208 225l-3 7M217 224l-2 7" stroke="#df868b" stroke-width="2.7" opacity=".55" stroke-linecap="round"/>
 <!-- tiny nose, cute smiling/kissing mouths -->
 <path d="M150 210q-5 12 2 15" stroke="#c48982" stroke-width="2.8" fill="none" stroke-linecap="round"/>
 <path class="nhi-boy-smile" d="M139 241q14 12 27-2" stroke="#9b5660" stroke-width="3.4" fill="none" stroke-linecap="round"/>
 <path class="nhi-boy-kiss-mouth" d="M132 241q11-10 17 0-5 8-14 6" fill="#dc8d95" stroke="#aa6874" stroke-width="2" opacity="0" stroke-linejoin="round"/>
</g>
</svg>