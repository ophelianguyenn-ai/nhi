<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 520" role="img" aria-label="Nhi chibi tóc nâu xoăn dài, kẹp tóc hồng, áo len hồng, ôm bó hoa vàng và giơ tay chữ V">
<defs>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2=".75"><stop stop-color="#73594f"/><stop offset=".42" stop-color="#60483f"/><stop offset="1" stop-color="#44342f"/></linearGradient>
 <linearGradient id="jumper" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#ffe0e3"/><stop offset=".5" stop-color="#ffd1da"/><stop offset="1" stop-color="#eeaab8"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff9ef"/><stop offset="1" stop-color="#ffe4d8"/></linearGradient>
 <linearGradient id="wrap" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff5c9"/><stop offset="1" stop-color="#e7cfa3"/></linearGradient>
 <radialGradient id="blush"><stop stop-color="#fb929b" stop-opacity=".76"/><stop offset="1" stop-color="#ffb9ad" stop-opacity="0"/></radialGradient>
 <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<ellipse cx="205" cy="505" rx="147" ry="9" opacity=".13" fill="#6d5048" filter="url(#softShadow)"/>
<!-- Back hair: warm, flowing waves, separate from head and shoulders -->
<g class="nhi-rig-hair-back" style="transform-origin:216px 120px">
 <path d="M92 159C69 115 76 61 112 41q19-30 58-24 17-21 49-17 54 0 85 40 44 26 45 94 9 40-3 75 24 44 10 91 26 35 11 80 23 49-15 87-29 20-57-2-27 18-58-2-37 19-69-4-37 12-64-19-52 16-73-26-26-26-14-73-12-24 0-51-5-27 17-52-5-24 14-48Z" fill="url(#hair)" stroke="#352a2c" stroke-width="6" stroke-linejoin="round"/>
 <path d="M97 118Q63 177 91 221T82 318Q62 367 83 415M116 99Q91 165 118 205T116 287Q90 362 110 427M148 78Q131 160 153 223T140 348Q131 395 151 459M296 92Q326 160 304 234T331 338Q349 397 324 443M319 150Q344 205 327 257T348 360" fill="none" stroke="#a28472" stroke-width="5" stroke-linecap="round" opacity=".47"/>
 <path d="M100 238Q61 304 89 351T104 447M305 227Q334 291 314 348T337 442" fill="none" stroke="#2f2929" stroke-width="4" opacity=".67"/>
</g>
<!-- Sweater; hand-drawn thick outline with pale folds -->
<g class="nhi-rig-body">
 <path d="M154 315q-51 9-70 67L68 484q65 33 160 33 84 1 138-29l-23-108q-18-58-74-69Z" fill="url(#jumper)" stroke="#513b3c" stroke-width="5" stroke-linejoin="round"/>
 <path d="M159 318q17 20 51 23 31 0 59-22" stroke="#b77e88" stroke-width="4" fill="none"/>
 <path d="M169 334q20 15 41 15 24 0 45-14" stroke="#ffe9e7" stroke-width="7" fill="none" stroke-linecap="round"/>
 <path d="M102 404q-3 38 8 76M316 393q12 43 1 87M151 479q49 13 116 1" stroke="#dc9ba6" stroke-width="4" stroke-linecap="round" opacity=".48" fill="none"/>
 <path d="M85 492q113 25 265-3" stroke="#f6d8d6" stroke-width="11" opacity=".8" fill="none"/>
 <g stroke="#d697a4" stroke-width="2" opacity=".45"><path d="M93 488v15M103 491v15M113 493v15M123 495v15M133 497v15M322 494v15M332 492v15M342 489v15"/></g>
</g>
<!-- Neck -->
<path d="M187 284v50q19 16 45 0v-54" fill="url(#skin)" stroke="#554046" stroke-width="4"/>
<path d="M174 328q10 24 37 23 31-1 48-23" stroke="#694a50" stroke-width="6" fill="none"/>
<!-- Arm holding flowers: its own articulated group -->
<g class="nhi-rig-arm-bouquet" style="transform-origin:125px 361px">
 <path d="M113 347q-29-14-42 22-17 53 24 101 27 25 85 19l63-21-23-47-55 10-27-45Z" fill="url(#jumper)" stroke="#594046" stroke-width="5" stroke-linejoin="round"/>
 <path d="M95 408q-7 38 19 57t52 9M114 436q18 21 44 22" stroke="#db99a6" stroke-width="4" opacity=".72" fill="none"/>
 <path d="M171 473q35 12 54-4l13-21-16-19-42 13q-14 15-9 31" fill="url(#skin)" stroke="#5a4144" stroke-width="4"/>
 <path d="M186 459q17 1 33-13" stroke="#c88e87" stroke-width="2.5" fill="none"/>
</g>
<!-- Bouquet can tilt independently, stays visually connected to the holding hand -->
<g class="nhi-rig-bouquet" style="transform-origin:215px 410px">
 <path d="M206 379l12 90M227 363l-9 110M193 358l25 116M247 368l-29 103M175 369l42 103" stroke="#477e4d" stroke-width="4.7" stroke-linecap="round"/>
 <g fill="#60a168" stroke="#326b4b" stroke-width="2.6">
  <path d="M207 420q-31-28-40-10 14 21 40 10M214 434q23-34 40-15-16 25-40 15M206 403q-34-16-34-1 15 17 34 1M227 398q26-25 34-5-20 18-34 5"/>
 </g>
 <path d="M160 387l26 74 28 20 50-22 17-78-33-14-54 6Z" fill="url(#wrap)" stroke="#67544e" stroke-width="3.8" stroke-linejoin="round"/>
 <path d="M177 398q27 8 48-13 19 10 44-3M184 429q40 13 70-1" stroke="#e0c18c" stroke-width="3" fill="none" opacity=".72"/>
 <g fill="#f7c84c" stroke="#8b632c" stroke-width="3.3" stroke-linejoin="round">
  <path d="M171 366q-14-14-4-26 4-8 17-5 8-23 27-13 12 7 4 22 21 0 20 18-2 18-22 19-19 14-33-2-17 0-9-13Z"/>
  <path d="M219 356q-13-16-3-28 10-8 21-3 13-20 27-6 7 9 0 21 18 3 14 17-7 18-23 16-20 12-36-1-12-4 0-16Z"/>
  <path d="M147 376q-10-14 1-24 7-6 17-2 11-14 22-3 7 9-2 17 13 8 5 21-10 14-24 7-15 8-19-16Z"/>
 </g>
 <path d="M179 361q10-15 19-11M236 348q8-10 17-7M151 376q12-8 22-3" stroke="#ffe994" stroke-width="5" stroke-linecap="round" fill="none"/>
 <g fill="#52935c" stroke="#2b6c45" stroke-width="2"><path d="M186 396q-25-16-26-4 7 18 26 4M235 390q25-18 31-4-16 17-31 4"/></g>
</g>
<!-- Face: separately movable head -->
<g class="nhi-rig-head" style="transform-origin:205px 272px">
 <path d="M111 164q-7-69 41-108 45-45 113-10 40 22 45 84 20 55-6 116-21 48-87 62-76 5-109-55-18-39 3-89Z" fill="url(#skin)" stroke="#4c393d" stroke-width="5.5" stroke-linejoin="round"/>
 <ellipse cx="108" cy="226" rx="17" ry="22" fill="url(#skin)" stroke="#543c3d" stroke-width="4"/>
 <path d="M106 219q-12 10-2 20" stroke="#eab5a4" stroke-width="3" fill="none"/>
 <ellipse cx="307" cy="215" rx="16" ry="22" fill="url(#skin)" stroke="#543c3d" stroke-width="4"/>
 <path d="M316 213q11 12 0 20" stroke="#eab5a4" stroke-width="3" fill="none"/>
 <ellipse cx="146" cy="239" rx="36" ry="24" fill="url(#blush)"/><ellipse cx="263" cy="238" rx="35" ry="24" fill="url(#blush)"/>
 <g stroke="#e69698" stroke-width="3" stroke-linecap="round" opacity=".9"><path d="M136 242l-2 8M145 243l-1 9M154 241l-1 7M252 241l-1 8M262 242l-1 9M271 241l-1 7"/></g>
 <!-- eyes and brows remain independently animatable -->
 <g class="nhi-rig-eyes" style="transform-origin:208px 215px">
  <path d="M145 200q14-10 29-1M245 198q12-9 24-1" stroke="#4c383c" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M141 222q18 20 37-1M239 222q16 19 35-1" stroke="#30282e" stroke-width="6.8" stroke-linecap="round" fill="none"/>
  <path d="M142 222l-5-5M272 220l5-5" stroke="#30282e" stroke-width="2.5" stroke-linecap="round"/>
 </g>
 <path d="M206 234q-3 6 2 8" stroke="#dfa39b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <g class="nhi-rig-mouth"><path d="M196 260q11 10 23-1" fill="none" stroke="#b97483" stroke-width="3.5" stroke-linecap="round"/></g>
</g>
<!-- Movable front hair flows over head and shoulders -->
<g class="nhi-rig-hair-front" style="transform-origin:211px 89px">
 <path d="M113 218q-28-38-22-91-6-70 51-100 28-29 57-21 58-21 101 23 31 34 31 89 2 24-9 52-3-28-26-44-23-5-51-49-10 40-55 65-26 19-77 25-3 23 0 51Z" fill="url(#hair)" stroke="#382b2e" stroke-width="5.8" stroke-linejoin="round"/>
 <path d="M107 148q-26 52-15 92-19 50-7 91-19 47 12 82-21 31 9 58 31 13 53-10-22-36-9-72-13-30 2-66-14-51-6-94" fill="url(#hair)" stroke="#3c2e30" stroke-width="5" stroke-linejoin="round"/>
 <path d="M287 113q32 37 23 92 26 42 14 84 29 34 20 78 20 37-5 70-19 25-41 9 16-36-6-64 14-29-2-64 20-60-1-100" fill="url(#hair)" stroke="#3c2e30" stroke-width="5" stroke-linejoin="round"/>
 <g fill="none" stroke="#9c7c6a" stroke-width="4" opacity=".6" stroke-linecap="round">
  <path d="M123 117q9-65 54-82M183 33q42-17 79 13M303 137q16 62-4 99M101 253q-10 57 3 93M116 330q-15 74 10 109M323 285q16 65-1 105"/>
  <path d="M236 59q21 42-30 76M282 74q23 42 23 75"/>
 </g>
 <path d="M124 179q-12-40 3-74M156 160q12-5 25-22M289 189q14-25 12-57" stroke="#31282c" stroke-width="3" opacity=".75" fill="none"/>
</g>
<!-- Peace-sign arm, drawn in front and independently rotated -->
<g class="nhi-rig-arm-peace" style="transform-origin:302px 359px">
 <path d="M298 343q34-6 51 23 18 34 19 105-16 29-67 16-26-43-24-101Z" fill="url(#jumper)" stroke="#594248" stroke-width="5"/>
 <path d="M319 451q14 5 32-3" stroke="#da9ca8" stroke-width="6" fill="none"/>
 <path d="M313 358l-8-30q-17-6-16-22 0-8 10-7l8 13-12-43q-4-15 5-18 10-3 13 13l12 43 9-46q3-17 13-14 11 3 6 19l-10 49q14-14 21-3 6 9-10 23l-18 27Z" fill="url(#skin)" stroke="#5c4245" stroke-width="5" stroke-linejoin="round"/>
 <path d="M304 315q7 3 12 14M325 318q8-3 12-1" stroke="#dca79f" stroke-width="2.3" fill="none" stroke-linecap="round"/>
 <path d="M302 345q18 9 37 1" fill="none" stroke="#b47786" stroke-width="3.5"/>
</g>
<!-- Two pink hair clips are part of head rig, never a floating fixed-position HTML control -->
<g class="nhi-rig-clips" style="transform-origin:132px 112px">
 <rect x="119" y="97" width="48" height="13" rx="6.5" transform="rotate(22 143 103)" fill="#ffc1cf" stroke="#523a40" stroke-width="3.5"/>
 <rect x="111" y="116" width="47" height="13" rx="6.5" transform="rotate(22 135 122)" fill="#f7a9c3" stroke="#523a40" stroke-width="3.5"/>
 <g id="nhiHairClipPlane" role="button" tabindex="0" aria-label="Chạm kẹp tóc để gọi máy bay kéo băng rôn Lương yêu Nhi" style="cursor:pointer">
  <title>Chạm kẹp tóc — máy bay Lương ❤️ Nhi</title>
  <rect x="92" y="77" width="91" height="73" rx="26" fill="transparent" pointer-events="all"/>
 </g>
</g>
</svg>