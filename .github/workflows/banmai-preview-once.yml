name: One-time FPT Marketplace Ban Mai voice preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/banmai-preview-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  preview:
    if: startsWith(github.event.head_commit.message, 'banmai-preview:')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the MP3 inspector and WAV converter
        run: |
          python -m pip install 'mutagen>=1.47,<2'
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Verify Marketplace integration without paid requests
        run: python -m unittest scripts/test_selected_voices.py -v
      - name: Create exactly one Ban Mai preview file, without modifying the manifest
        env:
          FPT_MARKETPLACE_API_KEY: ${{ secrets.FPT_MARKETPLACE_API_KEY }}
        run: |
          python - <<'PY'
          import asyncio
          import os
          import pathlib
          import sys

          sys.path.insert(0, str(pathlib.Path('scripts').resolve()))
          from generate_selected_voices import _generate
          from mutagen.mp3 import MP3

          key = os.environ.get('FPT_MARKETPLACE_API_KEY', '')
          if not key.strip():
              raise SystemExit('FPT_MARKETPLACE_API_KEY secret is missing or empty. No audio was changed.')
          phrase = 'Chào anh, hôm nay em xin báo cáo tiến độ công việc.'
          path = pathlib.Path('audio/preview/banmai-marketplace-demo.mp3')
          if not path.is_file():
              duration = asyncio.run(_generate('vi', phrase, path, key))
          else:
              duration = MP3(str(path)).info.length
          if duration < 0.5:
              raise SystemExit('The voice preview is too short to publish.')
          print(f'BAN MAI PREVIEW OK: {duration:.2f} seconds')
          print(f'PREVIEW FILE: {path}')
          PY
      - name: Publish preview MP3 only (do not change any existing lesson audio)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- audio/preview/banmai-marketplace-demo.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Add one FPT Ban Mai Marketplace speech preview"
            for n in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
      - name: Rebuild static website with new preview MP3
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
