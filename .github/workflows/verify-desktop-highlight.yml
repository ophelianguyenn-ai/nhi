name: Verify Desktop and Phone Phrase Highlights

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'nhi-stage-move-v1.js'
      - 'scripts/smoke-desktop-highlight.mjs'
      - '.github/workflows/verify-desktop-highlight.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-highlight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Puppeteer browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Start local website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/paired-highlight-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/paired-highlight-http.log
          exit 1
      - name: Verify mouse click and touch highlight the matching translations
        run: node scripts/smoke-desktop-highlight.mjs
