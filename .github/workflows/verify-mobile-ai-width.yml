name: Verify mobile AI bottom sheet and card width
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'study-update-v6.js'
      - '.github/workflows/verify-mobile-ai-width.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test driver
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify rendered mobile and desktop layouts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nhi-mobile-ai-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN||'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
          const errors=[];
          try{
            for(const width of [390,430,1280]){
              const ctx=await browser.createBrowserContext();
              const page=await ctx.newPage();
              page.on('pageerror',e=>errors.push(String(e)));
              await page.setViewport({width,height:820,isMobile:width<700,hasTouch:width<700,deviceScaleFactor:1});
              await page.evaluateOnNewDocument(()=>sessionStorage.setItem('nlc-cover-seen','1'));
              await page.goto('http://127.0.0.1:8765/#/lich-hoc',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.NHI_PLAN_V2?.snapshot().lessons.some(l=>l.total>5),{timeout:30000});
              await page.evaluate(()=>{
                const plan=window.NHI_PLAN_V2;
                const lesson=plan.snapshot().lessons.find(l=>l.total>5&&l.date<'2026-11-26');
                if(!lesson)throw Error('No eligible lesson');
                plan.startLessonById(lesson.id);
                window.NHI_COVER?.close();
              });
              await page.waitForSelector('#planBox .pcard',{visible:true,timeout:20000});
              await page.evaluate(()=>{const b=document.querySelector('#planBox .pcard button[aria-label^="Hỏi AI về thẻ"]');if(!b)throw Error('Missing AI card button');b.click();});
              await page.waitForFunction(()=>document.body.classList.contains('ai-open')&&document.querySelector('#aiPanel').getBoundingClientRect().width>50);
              await new Promise(r=>setTimeout(r,1100));
              const d=await page.evaluate(()=>{
                const rect=s=>{const r=document.querySelector(s).getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height};};
                return {build:document.documentElement.dataset.nhiBuild,docked:document.body.classList.contains('nhi-docked'),dockWidth:document.documentElement.style.getPropertyValue('--nhi-dock-width'),viewport:window.visualViewport?.width||innerWidth,viewportHeight:window.visualViewport?.height||innerHeight,card:rect('#planBox .pcard'),panel:rect('#aiPanel')};
              });
              console.log(width,JSON.stringify(d));
              if(width<700){
                if(d.docked||d.dockWidth!=='0px'||d.card.width<d.viewport*.85||Math.abs(d.panel.width-d.viewport)>4||Math.abs(d.panel.height-d.viewportHeight*.5)>4)throw Error('Mobile layout regression: '+JSON.stringify(d));
              }else if(!d.docked||parseFloat(d.dockWidth)<100)throw Error('Desktop AI dock regressed');
              if(width<700){
                if(d.card.y+d.card.height>d.panel.y+10)throw Error('Card extends behind AI sheet: '+JSON.stringify(d));
                const grip=await page.$('#nhiPhoneAIGrip'),g=await grip.boundingBox();
                await page.mouse.move(g.x+g.width/2,g.y+g.height/2);
                await page.mouse.down();
                await page.mouse.move(g.x+g.width/2,g.y+g.height/2-100,{steps:10});
                await page.mouse.up();
                await new Promise(r=>setTimeout(r,400));
                const resized=await page.evaluate(()=>({panel:document.querySelector('#aiPanel').getBoundingClientRect().height,card:document.querySelector('#planBox .pcard').getBoundingClientRect().height}));
                if(resized.panel<d.panel.height+70||resized.card>d.viewportHeight-resized.panel+5)throw Error('Drag did not resize both panes: '+JSON.stringify({before:d,after:resized}));
                console.log('PASS drag',JSON.stringify(resized));
                const early=await page.evaluate(()=>({brand:getComputedStyle(document.querySelector('#topbar')).display,progress:[...document.querySelectorAll('.nhi-study-topbar')].every(x=>!x.getClientRects().length),toolbar:getComputedStyle(document.querySelector('#planBox .pcard>.card-top')).display}));
                if(early.brand!=='none'||!early.progress||early.toolbar!=='none')throw Error('Study toolbar not hidden on drag: '+JSON.stringify(early));
                const mid=await page.evaluate(()=>({compact:document.body.classList.contains('nhi-ai-study-compact-v150'),button:document.querySelector('#planBox .pcard .hard').getBoundingClientRect().height,scale:parseFloat(document.documentElement.style.getPropertyValue('--nhi-phone-vi-scale'))}));
                if(!mid.compact||mid.button>37||!(mid.scale<1))throw Error('Compact controls/font not active: '+JSON.stringify(mid));
                await page.focus('#nhiPhoneAIGrip');await page.keyboard.press('End');
                await page.waitForFunction(()=>document.body.classList.contains('nhi-ai-study-english-hidden-v150'));
                const high=await page.evaluate(()=>({brand:getComputedStyle(document.querySelector('#topbar')).display,progress:[...document.querySelectorAll('.nhi-study-topbar')].every(x=>x.getClientRects().length===0),englishHidden:document.body.classList.contains('nhi-ai-study-english-hidden-v150'),scale:parseFloat(document.documentElement.style.getPropertyValue('--nhi-phone-vi-scale'))}));
                if(high.brand!=='none'||!high.progress||!high.englishHidden||high.scale>=mid.scale)throw Error('High AI pane did not hide chrome / shrink text: '+JSON.stringify(high));
                await page.$eval('#nhiPhoneAIGrip',el=>el.dispatchEvent(new MouseEvent('dblclick',{bubbles:true})));
                await page.waitForFunction(()=>!document.body.classList.contains('nhi-ai-study-compact-v150')&&!document.body.classList.contains('nhi-ai-study-chrome-hidden-v150')&&!document.body.classList.contains('nhi-ai-study-english-hidden-v150'));
                if(await page.$eval('#topbar',el=>getComputedStyle(el).display)==='none')throw Error('Header did not return on lowering AI');
                await page.$eval('#aiCfgBtn',b=>{if(document.getElementById('aiSetup').hidden)b.click();});
                const cfg=await page.evaluate(()=>({trash:!!document.querySelector('#aiPanel #aiNewBtn'),font:!!document.querySelector('#aiSetup #aiFontSize'),prompts:!!document.querySelector('#aiSetup #nhiAiQuickEditor'),fontVisible:!!document.querySelector('#aiSetup #aiFontSize')?.getClientRects().length}));
                if(cfg.trash||!cfg.font||!cfg.prompts||!cfg.fontVisible)throw Error('Chat settings migration failed: '+JSON.stringify(cfg));
                await page.select('#aiFontSize','20');
                if(await page.evaluate(()=>document.documentElement.style.getPropertyValue('--nhi-ai-font-size'))!=='20px')throw Error('Chat font setting not applied');
                console.log('PASS adaptive study controls, header, font and English visibility state');
                if(await page.$('#aiPanel .nhi-v2-chat-history'))throw Error('Chat history icon still visible');
                await page.$eval('#aiCfgBtn',b=>{if(!document.getElementById('aiSetup').hidden)b.click();});
                const dismissGrip=await page.$('#nhiPhoneAIGrip'),dismissBox=await dismissGrip.boundingBox();
                await page.mouse.move(dismissBox.x+dismissBox.width/2,dismissBox.y+dismissBox.height/2);
                await page.mouse.down();await page.mouse.move(dismissBox.x+dismissBox.width/2,815,{steps:15});await page.mouse.up();
                await page.waitForFunction(()=>!document.body.classList.contains('ai-open'));
                if(await page.evaluate(()=>document.body.classList.contains('nhi-phone-ai-dragging')||document.body.classList.contains('nhi-ai-study-compact-v150')))throw Error('Dismiss left stale study state');
                await page.evaluate(()=>window.NLC_AI.open('hotkey'));
                await page.waitForFunction(()=>document.body.classList.contains('ai-open')&&Math.abs(document.querySelector('#aiPanel').getBoundingClientRect().height-(window.visualViewport?.height||innerHeight)*.5)<4);
                console.log('PASS drag-to-dismiss and reopen at half height');
                await page.evaluate(()=>window.NLC_AI.close());
                await page.keyboard.press('Enter');
                await page.waitForSelector('#planBox .pcard .answer.ko',{visible:true});
                await page.waitForFunction(()=>getComputedStyle(document.querySelector('#planBox .answer.ko')).wordBreak==='keep-all');
                await page.evaluate(()=>window.NLC_AI.open('hotkey'));
                await page.focus('#nhiPhoneAIGrip');await page.keyboard.press('End');
                await page.waitForFunction(()=>document.body.classList.contains('nhi-ai-study-compact-v150'));
                const typography=await page.evaluate(()=>{const ko=document.querySelector('#planBox .answer.ko'),vi=document.querySelector('#planBox .vi-under'),stage=document.querySelector('#planBox .pfront');return {ko:parseFloat(getComputedStyle(ko).fontSize),vi:parseFloat(getComputedStyle(vi).fontSize),padding:parseFloat(getComputedStyle(stage).paddingTop),wrap:getComputedStyle(ko).wordBreak};});
                if(typography.ko>24||typography.vi<12||typography.padding<10||typography.wrap!=='keep-all')throw Error('Compact Korean layout: '+JSON.stringify(typography));
                console.log('PASS Korean word wrapping and compact type',JSON.stringify(typography));


                await page.screenshot({path:'/tmp/nhi-ai-drag-'+width+'.png'});
                await page.$eval('#nhiPhoneAIGrip',el=>el.dispatchEvent(new MouseEvent('dblclick',{bubbles:true})));
                await new Promise(r=>setTimeout(r,300));
              }
              await page.screenshot({path:'/tmp/nhi-ai-'+width+'.png'});
              await page.evaluate(()=>window.NLC_AI.close());
              await page.waitForFunction(()=>!document.body.classList.contains('ai-open'));
              await ctx.close();
            }
            console.log('PASS: mobile card full-width, AI half-height, desktop dock retained');
            if(errors.length)console.log('Other page errors:',JSON.stringify(errors));
          }finally{await browser.close();}
          JS
      - name: Save rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ai-layout-${{ github.run_attempt }}
          path: /tmp/nhi-ai-*.png
          if-no-files-found: ignore
          retention-days: 7
