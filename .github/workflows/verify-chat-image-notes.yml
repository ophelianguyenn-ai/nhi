name: Verify Chat, Image and Notes UX
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'card-images-v11.js'
      - 'nhi-chat-voice-v1.js'
      - 'nhi-chat-image-notes-v1.css'
      - 'nhi-chat-note-card-v2.css'
      - 'nhi-cat-phu-ba-20261117-v2.svg'
      - 'scripts/smoke-chat-image-notes-v1.mjs'
      - '.github/workflows/verify-chat-image-notes.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'card-images-v11.js'
      - 'nhi-chat-voice-v1.js'
      - 'nhi-chat-image-notes-v1.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Start site
        run: |
          if [ ! -f english.json ]; then printf '{"version":1,"cards":{}}\n' > english.json; fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nhi-chat-test.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nhi-chat-test.log
          exit 1
      - name: Verify animated kitten SVG structure
        run: python3 -c "import xml.etree.ElementTree as E; r=E.parse('nhi-cat-phu-ba-20261117-v2.svg').getroot(); assert r.tag.endswith('svg'); assert 'animation:' in open('nhi-cat-phu-ba-20261117-v2.svg').read()"
      - name: Verify microphone, notes, chat scroll and image reflow
        run: node scripts/smoke-chat-image-notes-v1.mjs
