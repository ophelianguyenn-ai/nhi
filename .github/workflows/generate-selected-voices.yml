name: Prepare FPT Ban Mai and Korean InJoon audio batches

on:
  # One-shot, low-cost pilot on an explicitly named commit only.
  # Whitespace from pasted GitHub secrets is sanitized by the generator.
  # Later workflow edits never trigger paid synthesis automatically.
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-selected-voices.yml
  workflow_dispatch:
    inputs:
      scope:
        description: 'Daily lesson only, or all built-in lessons'
        type: choice
        options: [daily, all]
        default: daily
      language:
        description: 'Vietnamese FPT Ban Mai, Korean InJoon, or both'
        type: choice
        options: [both, vi, ko]
        default: both
      offset:
        description: 'Skip this many unique language/text pairs'
        type: string
        default: '0'
      limit:
        description: 'Maximum pairs in this run (default 30; 0=all, use cautiously)'
        type: string
        default: '30'
      dry_run:
        description: 'Count/list phrases only. No API call or expense.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: fpt-banmai-injoon-audio
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'voice-pilot:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech tools
        run: python -m pip install 'edge-tts>=7,<8' 'mutagen>=1.47,<2'
      - name: Validate migration helpers without network
        run: python -m unittest scripts/test_selected_voices.py -v
      - name: Generate only the requested batch; never expose FPT_API_KEY to the website
        env:
          FPT_API_KEY: ${{ secrets.FPT_API_KEY }}
          CHOSEN_SCOPE: ${{ github.event_name == 'push' && 'daily' || inputs.scope || 'daily' }}
          CHOSEN_LANG: ${{ github.event_name == 'push' && 'both' || inputs.language || 'both' }}
          CHOSEN_OFFSET: ${{ github.event_name == 'push' && '0' || inputs.offset || '0' }}
          CHOSEN_LIMIT: ${{ github.event_name == 'push' && '4' || inputs.limit || '30' }}
          DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--scope "$CHOSEN_SCOPE" --language "$CHOSEN_LANG" --offset "$CHOSEN_OFFSET" --limit "$CHOSEN_LIMIT")
          if [[ "${{ github.event_name }}" == 'push' ]]; then args+=(--max-failures 1); else args+=(--allow-partial); fi
          if [[ "$DRY_RUN" == 'true' ]]; then args+=(--dry-run); fi
          python scripts/generate_selected_voices.py "${args[@]}"
      - name: Commit only complete and verified MP3 and manifest
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/ audio-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Migrate selected Vietnamese to FPT Ban Mai and Korean to InJoon'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              echo "Main moved, retrying $attempt/5"
              sleep 5
            done
            exit 1
          fi
      - name: Deploy migrated audio to GitHub Pages
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
