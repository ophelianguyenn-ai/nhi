name: Prepare FPT Marketplace Ban Mai and Korean InJoon audio batches

# Rollout request 2026-11-19: generate ONLY missing Vietnamese phrases for all
# 48 built-in lessons. Existing Ban Mai MP3s are detected by the manifest and
# retained unchanged. Never expose the Marketplace API key in website assets.
# Run manually in small groups after adding a valid Marketplace API key.
# Default dry run NEVER calls the billable FPT endpoint.
on:
  # One-time November 19 test/run after Marketplace key rotation.
  # Only explicitly named pilot/rollout commits trigger a billable run.
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-selected-voices.yml
  workflow_dispatch:
    inputs:
      scope:
        description: 'Daily lesson or all built-in lessons'
        type: choice
        options: [daily, all, lesson]
        default: daily
      lesson_id:
        description: 'Only for scope=lesson. November 19 ID is prefilled'
        type: string
        default: 'daily-2026-11-19-nhi-extracted'
      language:
        description: 'Vietnamese FPT Marketplace Ban Mai / Korean InJoon / both'
        type: choice
        options: [both, vi, ko]
        default: both
      offset:
        description: 'Skip this many language/text pairs'
        type: string
        default: '0'
      limit:
        description: 'Maximum pairs (default 10, 0=all, potentially costly)'
        type: string
        default: '10'
      dry_run:
        description: 'Preview only: no API call or expense'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: nhi-voice-audio-generation
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'banmai-19-pilot:') || startsWith(github.event.head_commit.message, 'banmai-19-rollout:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech tools and MP3 codec
        run: |
          python -m pip install 'edge-tts>=7,<8' 'mutagen>=1.47,<2'
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Validate FPT Marketplace requests and audio conversion offline
        run: python -m unittest scripts/test_selected_voices.py -v
      - name: Generate only the requested batch with protected Marketplace key
        env:
          FPT_MARKETPLACE_API_KEY: ${{ secrets.FPT_MARKETPLACE_API_KEY }}
          CHOSEN_SCOPE: ${{ github.event_name == 'push' && 'lesson' || inputs.scope || 'daily' }}
          CHOSEN_LESSON_ID: ${{ inputs.lesson_id || 'daily-2026-11-19-nhi-extracted' }}
          CHOSEN_LANG: ${{ github.event_name == 'push' && 'vi' || inputs.language || 'both' }}
          CHOSEN_OFFSET: ${{ inputs.offset || '0' }}
          CHOSEN_LIMIT: ${{ github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'banmai-19-pilot:') && '1' || '0') || inputs.limit || '10' }}
          DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--scope "$CHOSEN_SCOPE" --language "$CHOSEN_LANG" --lesson-id "$CHOSEN_LESSON_ID" --offset "$CHOSEN_OFFSET" --limit "$CHOSEN_LIMIT" --max-failures 3)
          if [[ "$DRY_RUN" == 'true' ]]; then args+=(--dry-run); fi
          python scripts/generate_selected_voices.py "${args[@]}"
      - name: Commit only completed audio and updated manifest
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/ audio-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Migrate selected audio to Marketplace Ban Mai and InJoon'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
      - name: Deploy migrated audio to GitHub Pages
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
