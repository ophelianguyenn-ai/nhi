name: Migrate built-in MP3 (FPT Ban Mai and Korean InJoon)

# Explicit batches only. Never automatically spend FPT API credits on a push.
on:
  workflow_dispatch:
    inputs:
      language:
        description: 'both / vi (FPT Ban Mai) / ko (InJoon)'
        type: choice
        options: [both, vi, ko]
        default: both
      offset:
        description: 'Skip this many pairs'
        type: string
        default: '0'
      limit:
        description: 'Max pairs (30 default; 0 = all, may be costly)'
        type: string
        default: '30'
      dry_run:
        description: 'Preview only, do not generate or spend credits'
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
concurrency:
  group: fpt-banmai-injoon-audio
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install selected voice engines and MP3 validator
        run: python -m pip install 'edge-tts>=7,<8' 'mutagen>=1.47,<2'
      - name: Generate verified replacements in requested batch
        env:
          FPT_API_KEY: ${{ secrets.FPT_API_KEY }}
          VOICE_LANG: ${{ inputs.language || 'both' }}
          VOICE_OFFSET: ${{ inputs.offset || '0' }}
          VOICE_LIMIT: ${{ inputs.limit || '30' }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--lang "$VOICE_LANG" --offset "$VOICE_OFFSET" --limit "$VOICE_LIMIT" --allow-partial)
          if [[ "$DRY_RUN" == 'true' ]]; then args+=(--dry-run); fi
          python scripts/generate_tts.py "${args[@]}"
      - name: Commit completed audio only
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/ audio-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Generate new Ban Mai and InJoon MP3s'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Deploy new audio to Pages
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
