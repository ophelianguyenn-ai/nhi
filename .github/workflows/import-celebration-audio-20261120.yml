name: Import exact user-provided completion audio
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-celebration-audio-20261120.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: import-user-completion-audio
  cancel-in-progress: false
jobs:
  import:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'import-user-audio:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate downloaded file against original uploaded MP3 checksum
        run: python3 scripts/import_completion_audio_20261120.py
      - name: Commit exact original recording if verified
        shell: bash
        run: |
          set -euo pipefail
          test -s nhi-celebration-jolandabayens-20261120.mp3
          echo "f0d849d6c4b4c5a3d6bb6bdaec8a84fb90b412a7d7d45c91befb501594e93ef4  nhi-celebration-jolandabayens-20261120.mp3" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- nhi-celebration-jolandabayens-20261120.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Publish original user-provided 9-second completion audio"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 4
            done
            exit 1
          fi
      - name: Trigger GitHub Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
