<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" role="img" aria-label="Mèo chibi màu kem hồng vẫy chân giơ like chúc mừng">
<defs>
<linearGradient id="catFur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefd"/><stop offset=".58" stop-color="#ffefdc"/><stop offset="1" stop-color="#f6d7ce"/></linearGradient>
<linearGradient id="innerEar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd0d5"/><stop offset="1" stop-color="#f2a4b1"/></linearGradient>
<radialGradient id="blush"><stop stop-color="#f39fb1" stop-opacity=".85"/><stop offset="1" stop-color="#ef9cae" stop-opacity="0"/></radialGradient>
<linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d3f3ff"/><stop offset="1" stop-color="#70c1f4"/></linearGradient>
<filter id="light"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>
<style><![CDATA[
#pawUp{transform-box:fill-box;transform-origin:25% 83%;animation:catWave 1.65s ease-in-out infinite}
#likeBadge{transform-box:fill-box;transform-origin:50% 65%;animation:likeFloat 1.9s ease-in-out infinite}
#eyes{transform-box:fill-box;transform-origin:center;animation:catBlink 5.3s infinite}
.star{transform-box:fill-box;transform-origin:center;animation:starTwinkle 2.8s ease-in-out infinite}
.star.two{animation-delay:.8s}
.star.three{animation-delay:1.3s}
@keyframes catWave{0%,100%{transform:rotate(1deg)}46%{transform:rotate(-18deg)}72%{transform:rotate(5deg)}}
@keyframes likeFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.08)}}
@keyframes catBlink{0%,85%,93%,100%{transform:scaleY(1)}89%{transform:scaleY(.13)}}
@keyframes starTwinkle{0%,100%{opacity:.45;transform:scale(.76)}50%{opacity:1;transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){#pawUp,#likeBadge,#eyes,.star{animation:none!important}}
]]></style>
<!-- pastel sparkle confetti, shy pink hearts -->
<g class="star" fill="#ffc65c" stroke="#eab46c" stroke-width="1.3"><path d="M48 80l6-15 6 15 15 6-15 5-6 16-6-16-15-5Z"/></g>
<g class="star two" fill="#f8bacd" stroke="#e59eae" stroke-width="1"><path d="M307 69l5-12 5 12 12 5-12 5-5 12-5-12-12-5Z"/></g>
<g class="star three" fill="#a3dbe7" stroke="#7cc4d5" stroke-width="1"><path d="M41 192l4-11 4 11 11 4-11 4-4 11-4-11-11-4Z"/></g>
<path d="M250 44C241 24 216 34 227 53c7 10 19 19 22 21 19-20 32-35 14-43-5-2-11-1-13 13Z" fill="#f3b6c6" stroke="#dc8fa8" stroke-width="2.5"/>
<path d="M96 55C84 43 65 49 69 65c3 11 14 20 19 24 18-12 21-28 12-34-3-2-5-2-4 0Z" fill="#ffe0a6" stroke="#f2bf6b" stroke-width="2"/>
<!-- floor -->
<ellipse cx="180" cy="286" rx="123" ry="11" fill="#a67c8e" opacity=".14"/>
<!-- playful curved fluffy tail -->
<path d="M235 216q76-19 77 20 1 32-54 26" fill="none" stroke="#ddae9f" stroke-width="33" stroke-linecap="round"/>
<path d="M235 215q76-20 76 19 1 28-53 27" fill="none" stroke="#fff1db" stroke-width="26" stroke-linecap="round"/>
<!-- plump body -->
<path d="M105 196q-42 18-36 59 7 41 90 40 103 1 110-40 7-38-32-60Z" fill="url(#catFur)" stroke="#ae827d" stroke-width="4.2" stroke-linejoin="round"/>
<ellipse cx="177" cy="243" rx="61" ry="39" fill="#fffaf2" opacity=".8"/>
<ellipse cx="98" cy="275" rx="30" ry="15" fill="#ffefde" stroke="#ad8580" stroke-width="3"/>
<ellipse cx="235" cy="275" rx="30" ry="15" fill="#ffefde" stroke="#ad8580" stroke-width="3"/>
<path d="M92 273q12 5 22 0M221 274q12 5 23 0" stroke="#d4a7a0" stroke-width="2.4" fill="none" stroke-linecap="round"/>
<!-- head ears -->
<path d="M97 106Q72 76 79 38q8-9 57 31Q182 56 224 72q47-42 57-32 12 34-12 67 31 52 4 98-27 49-104 48-75 1-101-43-30-50 29-104Z" fill="url(#catFur)" stroke="#a87e7c" stroke-width="4.3" stroke-linejoin="round"/>
<path d="M100 94Q86 73 89 57q15 8 32 25Z" fill="url(#innerEar)" stroke="#eeb4b8" stroke-width="2"/>
<path d="M254 91q20-31 22-31 4 25-12 42Z" fill="url(#innerEar)" stroke="#edb0b6" stroke-width="2"/>
<!-- forehead fur and bangs -->
<path d="M119 82q22-22 46-20-11 20-8 28M169 61q22 4 27 28M205 73q18 1 24 18" stroke="#dfb9ae" stroke-width="5.2" fill="none" stroke-linecap="round"/>
<!-- face -->
<ellipse cx="111" cy="179" rx="29" ry="20" fill="url(#blush)"/>
<ellipse cx="231" cy="178" rx="29" ry="20" fill="url(#blush)"/>
<g id="eyes" fill="none" stroke="#5a424c" stroke-width="6" stroke-linecap="round">
<path d="M111 158q12 14 26 0"/><path d="M200 158q12 14 26 0"/>
</g>
<path d="M161 179q10-7 19 0-7 10-19 0Z" fill="#d08d96" stroke="#9e6f76" stroke-width="1.5"/>
<path d="M171 186q-9 20-19 6M171 186q8 18 18 6" stroke="#805b65" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M98 193l8 4m10-6 5 6M222 191l-5 7m17-5-8 5" stroke="#dc99a5" stroke-width="2.3" stroke-linecap="round"/>
<!-- whiskers -->
<g fill="none" stroke="#a38c88" stroke-width="2.4" stroke-linecap="round">
<path d="M85 183 48 175M84 195l-36 6M254 184l35-11M255 198l37 4"/>
</g>
<!-- waving raised paw holding a little blue LIKE -->
<g id="pawUp">
<path d="M251 208q14-8 25-28l-1-35q4-17 17-9l7 36q9-16 19-10 8 9-3 26-17 39-41 51" fill="url(#catFur)" stroke="#ad8280" stroke-width="4" stroke-linejoin="round"/>
<path d="M284 145q6-5 8-1M304 176q6-5 11-6" stroke="#e2aea9" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="272" cy="228" rx="17" ry="13" fill="#fff0df" stroke="#b68c83" stroke-width="3"/>
</g>
<g id="likeBadge">
<circle cx="303" cy="98" r="40" fill="#9ddcf1" opacity=".25" filter="url(#light)"/>
<circle cx="302" cy="97" r="35" fill="url(#badge)" stroke="#64b3dd" stroke-width="3"/>
<path d="M287 98q12-11 17-23 4-10 11-5 7 5 0 20h12q12 0 8 11l-8 19h-29l-10-9Z" fill="#fffdf4" stroke="#468dbf" stroke-width="3" stroke-linejoin="round"/>
<rect x="280" y="96" width="12" height="25" rx="4" fill="#fbf7e9" stroke="#468dbf" stroke-width="3"/>
<path d="M298 92q7-8 10-17" stroke="#d3eefd" stroke-width="2.6" fill="none"/>
</g>
<path d="M152 272q18 7 41 0" fill="none" stroke="#e7c3b7" stroke-width="3" stroke-linecap="round"/>
</svg>